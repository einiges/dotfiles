

# startup (choose one):
# - uwsm + systemctl --user enable --now hypridle.service
# - exec-once = hypridle >> hyprland.conf

# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/#configuration
general {
	lock_cmd = pidof hyprlock || hyprlock --grace 2

	# lock before suspend.
	before_sleep_cmd = loginctl lock-session

    # to avoid having to press a key twice to turn on the display.
	after_sleep_cmd = hyprctl dispatch 'hl.disp.dpms({ action = "enable" })'
}

